<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntiSnow</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        .top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .brand-card, .user-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            backdrop-filter: blur(5px);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #0056b3;
        }

        .btn-danger {
            background: #ff3b30;
        }

        .btn-danger:hover {
            background: #c1271d;
        }

        .btn-admin {
            background: #5856d6;
        }

        .btn-admin:hover {
            background: #3634a3;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .add-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: #007aff;
            color: white;
            font-size: 32px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-badge {
            font-size: 12px;
            padding: 2px 6px;
            background: #e5e5ea;
            border-radius: 4px;
            color: #333;
            text-transform: uppercase;
        }

        .badge-admin {
            background: #5856d6;
            color: white;
        }

        .popup-img {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand-card">
            <h2>❄️ AntiSnow</h2>
        </div>
        <div class="user-card" id="userContainer">
            <!-- Заполняется динамически -->
        </div>
    </div>

    <div id="map"></div>

    <button class="add-btn" id="addReportBtn" style="display: none;" onclick="openReportModal()">+</button>

    <!-- Модальное окно авторизации -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">Авторизация</h3>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="pass" placeholder="••••••••">
            </div>
            <div class="modal-actions">
                <button class="btn" style="background: #8e8e93;" onclick="closeModal('authModal')">Отмена</button>
                <button class="btn" style="background: #34c759;" onclick="auth('reg')">Регистрация</button>
                <button class="btn" onclick="auth('login')">Войти</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания отчета -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">Сообщить об уборке снега</h3>
            <div class="form-group">
                <label>Тип проблемы</label>
                <select id="snowType">
                    <option value="Нерасчищенный снег">Нерасчищенный снег</option>
                    <option value="Гололед">Гололед</option>
                    <option value="Сосульки">Сосульки / Сход снега</option>
                    <option value="Заблокированный проезд">Заблокированный проезд</option>
                </select>
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="reportDesc" rows="3" placeholder="Укажите подробности..."></textarea>
            </div>
            <div class="form-group">
                <label>Фотография (до 20 МБ)</label>
                <input type="file" id="reportPhoto" accept="image/*">
            </div>
            <div class="modal-actions">
                <button class="btn" style="background: #8e8e93;" onclick="closeModal('reportModal')">Отмена</button>
                <button class="btn" onclick="submitReport()">Отправить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно Админ-панели -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width: 600px;">
            <h3 style="margin-bottom: 15px;">Панель администратора</h3>
            <div id="adminReportsList" style="max-height: 400px; overflow-y: auto;">
                <!-- Список отчетов для управления статусом -->
            </div>
            <div class="modal-actions">
                <button class="btn" style="background: #8e8e93;" onclick="closeModal('adminModal')">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let selectedCoords = null;
        let tempMarker = null;
        let reportsLayerGroup = L.layerGroup();

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            checkAuthUI();
            loadReports();
        });

        function initMap() {
            // Центрируем карту (Сыктывкар)
            map = L.map('map').setView([61.6688, 50.8356], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            reportsLayerGroup.addTo(map);

            map.on('click', (e) => {
                const token = localStorage.getItem('token');
                if (!token) {
                    alert("Авторизуйтесь, чтобы ставить метки");
                    openModal('authModal');
                    return;
                }
                selectedCoords = e.latlng;
                if (tempMarker) map.removeLayer(tempMarker);
                tempMarker = L.marker(selectedCoords).addTo(map);
                openReportModal();
            });
        }

        function checkAuthUI() {
            const token = localStorage.getItem('token');
            const email = localStorage.getItem('email');
            const role = localStorage.getItem('role');
            const userContainer = document.getElementById('userContainer');
            const addBtn = document.getElementById('addReportBtn');

            if (token && email) {
                const isAdmin = role === 'admin';
                userContainer.innerHTML = `
                    <div>
                        <div style="font-weight: 600; font-size: 14px;">${email}</div>
                        <span class="user-badge ${isAdmin ? 'badge-admin' : ''}">${role || 'user'}</span>
                    </div>
                    ${isAdmin ? `<button class="btn btn-admin" onclick="openAdminPanel()">Админка</button>` : ''}
                    <button class="btn btn-danger" onclick="logout()">Выйти</button>
                `;
                addBtn.style.display = 'flex';
            } else {
                userContainer.innerHTML = `
                    <button class="btn" onclick="openModal('authModal')">Войти / Регистрация</button>
                `;
                addBtn.style.display = 'none';
            }
        }

        async function auth(type) {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('pass').value.trim();

            if (!email || !password) {
                alert("Заполните поля Email и Пароль");
                return;
            }

            if (type === 'reg') {
                try {
                    const res = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, password: password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        alert("Регистрация успешна! Теперь нажмите 'Войти'");
                    } else {
                        const errMsg = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
                        alert("Ошибка регистрации: " + (errMsg || "Неизвестная ошибка"));
                    }
                } catch (err) {
                    alert("Ошибка сети при регистрации");
                }
            } else {
                try {
                    const formData = new URLSearchParams();
                    formData.append('username', email);
                    formData.append('password', password);

                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData.toString()
                    });

                    const data = await res.json();

                    if (res.ok) {
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('role', data.role);
                        localStorage.setItem('email', data.email);
                        closeModal('authModal');
                        checkAuthUI();
                        alert("Успешный вход!");
                        location.reload();
                    } else {
                        const errMsg = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
                        alert("Ошибка входа: " + (errMsg || "Неверный логин или пароль"));
                    }
                } catch (err) {
                    alert("Ошибка сети при входе");
                }
            }
        }

        function logout() {
            localStorage.clear();
            checkAuthUI();
            location.reload();
        }

        async function loadReports() {
            try {
                const res = await fetch('/api/reports');
                if (!res.ok) return;
                const reports = await res.json();

                reportsLayerGroup.clearLayers();

                reports.forEach(r => {
                    const marker = L.marker([r.lat, r.lon]);
                    let popupContent = `
                        <div style="max-width: 200px;">
                            <h4 style="margin-bottom: 5px;">${r.snow_type}</h4>
                            <p style="font-size: 13px; color: #555;">${r.description || 'Без описания'}</p>
                            <p style="margin-top: 5px;"><b>Статус:</b> ${r.status}</p>
                    `;
                    if (r.photo_url) {
                        popupContent += `<img src="${r.photo_url}" class="popup-img">`;
                    }
                    popupContent += `</div>`;
                    marker.bindPopup(popupContent);
                    reportsLayerGroup.addLayer(marker);
                });
            } catch (err) {
                console.error("Ошибка загрузки меток:", err);
            }
        }

        async function submitReport() {
            if (!selectedCoords) {
                alert("Кликните на карту, чтобы выбрать место!");
                return;
            }

            const token = localStorage.getItem('token');
            const snowType = document.getElementById('snowType').value;
            const desc = document.getElementById('reportDesc').value;
            const photoInput = document.getElementById('reportPhoto');

            const formData = new FormData();
            formData.append('lat', selectedCoords.lat);
            formData.append('lon', selectedCoords.lng);
            formData.append('snow_type', snowType);
            if (desc) formData.append('description', desc);
            if (photoInput.files[0]) {
                formData.append('file', photoInput.files[0]);
            }

            try {
                const res = await fetch('/api/reports', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (res.ok) {
                    alert("Отчет успешно создан!");
                    closeModal('reportModal');
                    if (tempMarker) map.removeLayer(tempMarker);
                    document.getElementById('reportDesc').value = '';
                    document.getElementById('reportPhoto').value = '';
                    loadReports();
                } else if (res.status === 413) {
                    alert("Ошибка: Загружаемый файл слишком большой! Уменьшите размер фото или увеличьте client_max_body_size в Nginx.");
                } else {
                    const err = await res.json();
                    alert("Ошибка создания отчета: " + (err.detail || "Не удалось сохранить"));
                }
            } catch (e) {
                alert("Ошибка сети при отправке отчета");
            }
        }

        async function openAdminPanel() {
            openModal('adminModal');
            const listContainer = document.getElementById('adminReportsList');
            listContainer.innerHTML = 'Загрузка отчетов...';

            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/reports', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const reports = await res.json();

                if (!reports || reports.length === 0) {
                    listContainer.innerHTML = 'Нет активных отчетов.';
                    return;
                }

                let html = '<div style="display: flex; flex-direction: column; gap: 10px;">';
                reports.forEach(r => {
                    html += `
                        <div style="border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                            <div><b>ID:</b> ${r.id} | <b>Тип:</b> ${r.snow_type}</div>
                            <div><b>Описание:</b> ${r.description || '-'}</div>
                            <div><b>Текущий статус:</b> ${r.status}</div>
                            <div style="margin-top: 8px; display: flex; gap: 5px;">
                                <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick="updateStatus(${r.id}, 'В работе')">В работу</button>
                                <button class="btn" style="padding: 4px 8px; font-size: 12px; background: #34c759;" onclick="updateStatus(${r.id}, 'Выполнено')">Завершить</button>
                                <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deleteReport(${r.id})">Удалить</button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                listContainer.innerHTML = html;
            } catch (err) {
                listContainer.innerHTML = 'Ошибка при загрузке списка отчетов.';
            }
        }

        async function updateStatus(reportId, newStatus) {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/reports/${reportId}/status?status=${encodeURIComponent(newStatus)}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    openAdminPanel();
                    loadReports();
                } else {
                    alert("Не удалось обновить статус");
                }
            } catch (e) {
                alert("Ошибка сети");
            }
        }

        async function deleteReport(reportId) {
            if (!confirm("Удалить этот отчет?")) return;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/reports/${reportId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    openAdminPanel();
                    loadReports();
                } else {
                    alert("Не удалось удалить отчет");
                }
            } catch (e) {
                alert("Ошибка сети");
            }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openReportModal() { openModal('reportModal'); }
    </script>
</body>
</html>
