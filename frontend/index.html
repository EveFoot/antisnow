<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AntiSnow Mobile Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --blue: #007AFF; --red: #FF3B30; --green: #34C759; --bg: #F2F2F7; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        .nav-bar { 
            position: absolute; top: 10px; left: 10px; right: 10px;
            z-index: 1000; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            padding: 8px 12px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
        }

        .filter-select {
            padding: 6px 10px; border-radius: 12px; border: 1px solid #ddd;
            font-size: 13px; background: #fff; outline: none; margin: 0; width: auto;
        }

        .side-panel { 
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 85vh; 
            background: white; z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            border-radius: 25px 25px 0 0; padding: 20px; box-sizing: border-box;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.15); overflow-y: auto;
        }
        .side-panel.open { bottom: 0; }

        @media (min-width: 768px) {
            .side-panel { top: 0; right: -400px; bottom: auto; left: auto; width: 360px; height: 100vh; border-radius: 0; }
            .side-panel.open { right: 0; }
        }

        .btn { border: none; padding: 15px; border-radius: 15px; cursor: pointer; font-weight: 600; font-size: 16px; width: 100%; display: block; margin-top: 10px; text-align: center; text-decoration: none; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-blue:disabled { background: #abaeb3; }
        .btn-outline { background: #E9E9EB; color: #000; }

        input, select, textarea { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; background: #F2F2F7; }

        .photo-grid { display: flex; gap: 8px; margin: 10px 0; }
        .photo-item { flex: 1; background: #eee; border-radius: 10px; height: 100px; overflow: hidden; border: 1px solid #ddd; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .preview-container {
            display: none; position: relative; width: 100%; height: 160px;
            margin: 10px 0; border-radius: 12px; overflow: hidden; border: 1px solid #ddd;
        }
        .preview-container img { width: 100%; height: 100%; object-fit: cover; }
        .preview-remove-btn {
            position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6);
            color: white; border: none; border-radius: 50%; width: 28px; height: 28px;
            cursor: pointer; font-weight: bold; font-size: 14px; display: flex;
            align-items: center; justify-content: center;
        }
        .status-select-popup {
            width: 100%; padding: 6px; margin-top: 6px; border-radius: 8px;
            border: 1px solid #007AFF; font-size: 12px; background: #fff; font-weight: 600;
        }
    </style>
</head>
<body>

<div class="nav-bar">
    <b id="user-display">AntiSnow</b>
    
    <select id="status-filter" class="filter-select" onchange="filterMarkers()">
        <option value="all">🌐 Все метки</option>
        <option value="pending">🔴 В очереди</option>
        <option value="cleaned">🔵 Убрано</option>
        <option value="verified">🟢 Подтверждено</option>
    </select>

    <div style="display: flex; gap: 8px;">
        <button class="btn btn-outline" style="padding: 8px 12px; width: auto; margin:0" onclick="toggle('auth-p')">👤</button>
        <button id="adm-btn" class="btn" style="display:none; background:#333; color:white; padding: 8px 12px; width: auto; margin:0" onclick="openAdmin()">⚙️</button>
    </div>
</div>

<div id="map"></div>

<div id="auth-p" class="side-panel">
    <div style="width: 40px; height: 5px; background: #ddd; margin: 0 auto 20px; border-radius: 10px;"></div>
    <h2>Аккаунт</h2>
    <div id="auth-form">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Пароль">
        <button class="btn btn-blue" onclick="auth('login')">Войти</button>
        <button class="btn btn-outline" onclick="auth('reg')">Регистрация</button>
    </div>
    <div id="user-info" style="display:none">
        <p>Вы вошли как: <b id="user-mail-info"></b></p>
        <button class="btn btn-outline" style="color:var(--red)" onclick="logout()">Выйти</button>
    </div>
    <button class="btn btn-outline" onclick="toggle()">Закрыть</button>
</div>

<div id="add-p" class="side-panel">
    <div style="width: 40px; height: 5px; background: #ddd; margin: 0 auto 20px; border-radius: 10px;"></div>
    <h2>Сообщить о проблеме</h2>
    <p style="font-size: 14px;">Координаты: <span id="cur-coords" style="color:var(--blue)">...</span></p>
    <input type="hidden" id="lat"><input type="hidden" id="lon">
    <select id="stype">
        <option>Снежный завал</option>
        <option>Гололед</option>
        <option>Снежная каша / Грязь</option>
    </select>
    <textarea id="desc" placeholder="Описание..." rows="3"></textarea>
    
    <input type="file" id="file-in" accept="image/*" onchange="handleFileSelect(this)">
    
    <div id="preview-box" class="preview-container">
        <img id="preview-img" src="" alt="Предпросмотр">
        <button class="preview-remove-btn" onclick="clearPhotoPreview()">✕</button>
    </div>

    <button id="save-btn" class="btn btn-blue" onclick="save()">Отправить</button>
    <button class="btn btn-outline" onclick="toggle()">Отмена</button>
</div>

<div id="adm-p" class="side-panel">
    <h2>Админ-панель</h2>
    
    <!-- Секция добавления нового пользователя -->
    <div style="background: #f8f9fa; padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ddd;">
        <h3 style="margin-top:0; font-size:15px;">Добавить пользователя</h3>
        <input type="email" id="new-user-email" placeholder="Email" style="margin: 4px 0;">
        <input type="password" id="new-user-pass" placeholder="Пароль" style="margin: 4px 0;">
        <select id="new-user-role" style="margin: 4px 0;">
            <option value="user">User</option>
            <option value="cleaner">Cleaner</option>
            <option value="admin">Admin</option>
        </select>
        <button class="btn btn-blue" style="padding: 10px; font-size: 14px; margin-top: 6px;" onclick="createUserByAdmin()">Создать</button>
    </div>

    <div id="u-list"></div>
    <button class="btn btn-outline" onclick="toggle()">Закрыть</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map', {zoomControl: false}).setView([61.6688, 50.8365], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let allMarkersMap = new Map();

    function toggle(id) {
        document.querySelectorAll('.side-panel').forEach(p => p.classList.remove('open'));
        if(id) document.getElementById(id).classList.add('open');
    }

    function logout() { localStorage.clear(); location.reload(); }

    map.on('click', e => {
        if(!localStorage.getItem('token')) return toggle('auth-p');
        document.getElementById('lat').value = e.latlng.lat;
        document.getElementById('lon').value = e.latlng.lng;
        document.getElementById('cur-coords').innerText = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
        clearPhotoPreview();
        toggle('add-p');
    });

    function handleFileSelect(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('preview-box').style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            clearPhotoPreview();
        }
    }

    function clearPhotoPreview() {
        document.getElementById('file-in').value = '';
        document.getElementById('preview-img').src = '';
        document.getElementById('preview-box').style.display = 'none';
    }

    function compressImg(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 1200;
                    let w = img.width, h = img.height;
                    if (w > maxW) { h *= maxW / w; w = maxW; }
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    canvas.toBlob((blob) => {
                        resolve(new File([blob], file.name, {type: 'image/jpeg'}));
                    }, 'image/jpeg', 0.7);
                };
            };
        });
    }

    async function auth(t) {
        const e = document.getElementById('email').value.trim();
        const p = document.getElementById('pass').value.trim();

        if(!e || !p) return alert("Заполните email и пароль");

        if (t === 'login') {
            const body = new URLSearchParams();
            body.append('username', e);
            body.append('password', p);

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });

            if (res.ok) {
                const d = await res.json();
                localStorage.setItem('token', d.access_token);
                localStorage.setItem('role', d.role);
                localStorage.setItem('email', d.email);
                location.reload();
            } else {
                alert("Неверный логин или пароль");
            }
        } else {
            const res = await fetch(`/api/auth/register?email=${encodeURIComponent(e)}&password=${encodeURIComponent(p)}`, { method: 'POST' });
            if (res.ok) {
                alert("Регистрация успешна! Теперь нажмите 'Войти'");
            } else {
                alert("Ошибка регистрации");
            }
        }
    }

    async function save() {
        const btn = document.getElementById('save-btn');
        const fileIn = document.getElementById('file-in');
        btn.disabled = true; btn.innerText = "Сохранение...";

        try {
            const fd = new FormData();
            fd.append('lat', document.getElementById('lat').value);
            fd.append('lon', document.getElementById('lon').value);
            fd.append('snow_type', document.getElementById('stype').value);
            
            const descVal = document.getElementById('desc').value.trim();
            if(descVal) {
                fd.append('description', descVal);
            }
            
            if(fileIn.files && fileIn.files[0]) {
                btn.innerText = "Сжатие и отправка...";
                const compressed = await compressImg(fileIn.files[0]);
                fd.append('file', compressed);
            }

            const token = localStorage.getItem('token');
            const headers = {};
            if(token) headers['Authorization'] = `Bearer ${token}`;

            const res = await fetch('/api/reports', {
                method: 'POST',
                headers: headers,
                body: fd
            });
            
            if(res.ok) { 
                alert("Успешно!"); 
                location.reload(); 
            } else {
                const errData = await res.json().catch(() => ({}));
                alert(`Ошибка сервера: ${errData.detail || res.statusText}`);
            }
        } catch(e) { 
            alert("Ошибка сети или передачи данных"); 
        } finally { 
            btn.disabled = false; 
            btn.innerText = "Отправить"; 
        }
    }

    async function load() {
        const res = await fetch('/api/reports');
        const data = await res.json();
        const role = localStorage.getItem('role');

        allMarkersMap.forEach(item => map.removeLayer(item.marker));
        allMarkersMap.clear();

        data.forEach(r => {
            const marker = createMarker(r, role);
            allMarkersMap.set(r.id, { marker: marker, status: r.status });
        });
    }

    function createMarker(r, role) {
        let color = 'red';
        if(r.status === 'cleaned') color = 'blue';
        if(r.status === 'verified') color = 'green';

        const icon = L.icon({
            iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`,
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34]
        });

        const m = L.marker([r.lat, r.lon], {icon}).addTo(map);
        const getImg = (url) => url ? `<img src="${window.location.origin + url}">` : `<div style="padding:20px;text-align:center;color:#999;font-size:10px">Нет фото</div>`;

        let h = `<div style="width:250px">
            <b style="font-size:16px">${r.snow_type}</b>
            <p style="font-size:13px;color:#555">${r.description || ''}</p>
            <div class="photo-grid">
                <div class="photo-item">${getImg(r.photo_url)}</div>
                <div class="photo-item">${getImg(r.done_photo_url)}</div>
            </div>`;
        
        if (role === 'admin' || role === 'cleaner') {
            h += `<div style="margin-top:8px; border-top:1px solid #eee; padding-top:6px;">
                <label style="font-size:11px; font-weight:bold; color:#333;">Изменить статус:</label>
                <select class="status-select-popup" onchange="changeStatus(${r.id}, this.value)">
                    <option value="pending" ${r.status==='pending'?'selected':''}>🔴 В очереди</option>
                    <option value="cleaned" ${r.status==='cleaned'?'selected':''}>🔵 Убрано</option>
                    <option value="verified" ${r.status==='verified'?'selected':''}>🟢 Подтверждено</option>
                </select>
            </div>`;
        }

        if(r.status === 'pending' && (role === 'cleaner' || role === 'admin')) {
            h += `<div style="margin-top:8px;"><input type="file" id="f-${r.id}" style="font-size:11px"><button class="btn btn-blue" style="padding:8px;font-size:13px" onclick="setDone(${r.id})">Загрузить отчет</button></div>`;
        }
        if(role === 'admin') h += `<button onclick="del(${r.id})" style="width:100%;background:none;border:none;color:red;font-size:11px;margin-top:10px;cursor:pointer">Удалить метку</button>`;
        
        m.bindPopup(h + `</div>`);
        return m;
    }

    async function changeStatus(id, newStatus) {
        try {
            const res = await fetch(`/api/reports/${id}/status`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify({ status: newStatus })
            });

            if (res.ok) {
                load();
            } else {
                alert("Недостаточно прав для изменения статуса");
            }
        } catch (e) {
            alert("Ошибка сети при смене статуса");
        }
    }

    function filterMarkers() {
        const filterVal = document.getElementById('status-filter').value;
        allMarkersMap.forEach((item) => {
            if (filterVal === 'all' || item.status === filterVal) {
                if (!map.hasLayer(item.marker)) map.addLayer(item.marker);
            } else {
                if (map.hasLayer(item.marker)) map.removeLayer(item.marker);
            }
        });
    }

    async function setDone(id) {
        const f = document.getElementById(`f-${id}`).files[0];
        if(!f) return alert("Выберите фото");
        const btn = event.target; btn.disabled = true; btn.innerText = "...";
        const fd = new FormData(); 
        const compressed = await compressImg(f);
        fd.append('file', compressed);
        await fetch(`/api/reports/${id}/done`, {method:'POST', body:fd});
        location.reload();
    }

    async function del(id) {
        if(confirm('Удалить?')) {
            await fetch(`/api/reports/${id}`, {method:'DELETE', headers:{'Authorization':`Bearer ${localStorage.getItem('token')}`}});
            location.reload();
        }
    }

    async function openAdmin() {
        toggle('adm-p');
        const res = await fetch('/api/admin/users', {headers:{'Authorization':`Bearer ${localStorage.getItem('token')}`}});
        const users = await res.json();
        document.getElementById('u-list').innerHTML = users.map(u => `
            <div style="padding:10px 0; border-bottom:1px solid #eee">
                <b>${u.email}</b>
                <select onchange="updateRole(${u.id}, this.value)">
                    <option value="user" ${u.role==='user'?'selected':''}>User</option>
                    <option value="cleaner" ${u.role==='cleaner'?'selected':''}>Cleaner</option>
                    <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
                </select>
            </div>
        `).join('');
    }

    async function createUserByAdmin() {
        const email = document.getElementById('new-user-email').value.trim();
        const password = document.getElementById('new-user-pass').value.trim();
        const role = document.getElementById('new-user-role').value;

        if (!email || !password) return alert("Введите Email и пароль");

        const res = await fetch('/api/admin/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            },
            body: JSON.stringify({ email, password, role })
        });

        if (res.ok) {
            alert("Пользователь успешно создан");
            document.getElementById('new-user-email').value = '';
            document.getElementById('new-user-pass').value = '';
            openAdmin();
        } else {
            const err = await res.json().catch(() => ({}));
            alert(`Ошибка: ${err.detail || 'Не удалось создать пользователя'}`);
        }
    }

    async function updateRole(uid, role) {
        await fetch(`/api/admin/users/${uid}/role?new_role=${role}`, {method:'PATCH', headers:{'Authorization':`Bearer ${localStorage.getItem('token')}`}});
    }

    if(localStorage.getItem('token')) {
        document.getElementById('user-display').innerText = localStorage.getItem('email').split('@')[0];
        document.getElementById('auth-form').style.display = 'none';
        document.getElementById('user-info').style.display = 'block';
        document.getElementById('user-mail-info').innerText = localStorage.getItem('email');
        if(localStorage.getItem('role') === 'admin') document.getElementById('adm-btn').style.display = 'block';
    }
    load();
</script>
</body>
</html>
